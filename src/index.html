<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>GlamStudio · Agenda tu cita</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Agenda tu cita en GlamStudio: pestañas, cejas, depilación y tratamientos.">
  <meta name="theme-color" content="#faf7fc">
  <!-- Two installable apps from one site: clients get "Reservas" (opens /agendar),
       the studio gets the admin panel. Picked by the page the visitor lands on;
       AppComponent keeps it in sync when navigating between the two. -->
  <script>
    (function () {
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.id = 'app-manifest';
      var path = location.pathname;
      link.href = path.indexOf('/admin') === 0 ? '/manifest.webmanifest' : '/manifest-booking.webmanifest';
      document.head.appendChild(link);
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GlamStudio">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
